<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/media.css">
 


    <link rel="icon" href="img/favcatblack.png">
    
    <title>Blinders Barbershop</title>
</head>
<body>

  
    <!-- banner -->

    <header class="header_opening">

        <!-- efeitos do banner -->
        <div class="efeitos">
            <div class="black_overlay"></div>
            <div class="gradient_overlay"></div>
            <div class="grain"></div>
        </div>

        <!-- logo e afins -->
        <div class="detalhe">
            <img src="./img/coroa.png" class="detalhe_logo" alt="detalhe da logo">
        </div>
        <div class="container_logo">
            <img src="img/LOGO BRANCO.png" class="logo_splash" alt="logo da Blinders BarberShop">
            <h1>ELEGÂNCIA CORTANTE</h1>
            <hr class="borda">
        </div>

        <!-- entrar -->
        <div class="container_entrar">
            <button class="btn" onclick="entrarSite()">Seja Bem Vindo!</button>
        </div>
        
    </header>


    <div id="player">
        <audio id="bg-music" src="./music/Nick Cave & The Bad Seeds - Red Right Hand (Mojo Filter Remix) Peaky Blinders Soundtrack.MP3" loop preload="auto"></audio>
    </div>

    <!-- botão de som: aparece desde o início; o navegador só libera o áudio depois de um toque -->
    <button type="button" id="som-toggle" class="som-toggle esperando" aria-label="Ativar som" aria-pressed="false">
        <svg class="icone-som" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path class="onda" d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>
            <path d="M3 9v6h4l5 5V4L7 9H3z"/>
            <path class="mudo" d="M20.5 8.9l-1.4-1.4-2.6 2.6-2.6-2.6-1.4 1.4 2.6 2.6-2.6 2.6 1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4-2.6-2.6z"/>
        </svg>
        <span class="som-texto">Toque para ativar o som</span>
    </button>

    <script src="script.js"></script>
</body>
</html>
